services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-alumni123}
      APP_USER: ${ORA_USER:-alumni}
      APP_USER_PASSWORD: ${ORA_PASSWORD:-alumni123}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  webapp:
    build: ./webapp
    environment:
      ORA_DSN: oracle-db:1521/FREEPDB1
      ORA_USER: ${ORA_USER:-alumni}
      ORA_PASSWORD: ${ORA_PASSWORD:-alumni123}
    ports:
      - "8000:8000"
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle-data:
